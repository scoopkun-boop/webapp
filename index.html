<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>城門防衛 Ver.4.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}body{display:grid;place-items:center}#app{width:min(100vw,1100px);height:100dvh;padding:5px 6px;display:flex;flex-direction:column;gap:5px}.hud{height:55px;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,36px)}.metric{display:flex;flex-direction:column;align-items:center;min-width:58px}.metric small{font-size:11px;color:#cbd5e1}.metric strong{font-size:20px}.hp{min-width:150px}.track{width:150px;height:10px;background:#4a2020;border-radius:8px;overflow:hidden}.bar{height:100%;width:100%;background:#38d06f}button{border:0;border-radius:9px;padding:10px 15px;background:#dca14a;color:#1b160e;font-weight:800;cursor:pointer}#wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:48/31;border:3px solid #6a4d31;border-radius:14px;box-shadow:0 12px 35px #0009;background:#70c7ef;cursor:crosshair;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#060a11c7;font-size:clamp(34px,8vw,72px);font-weight:900}.overlay span{display:block;font-size:.25em;margin-top:10px}.hidden{display:none}.help{text-align:center;color:#cbd5e1;font-size:12px;height:19px}@media(pointer:coarse),(max-width:700px){#app{padding:2px}.hud{height:48px;gap:6px}.metric{min-width:42px}.metric strong{font-size:16px}.hp{min-width:95px}.track{width:95px}.help{display:none}button{padding:8px 9px}}
</style>
</head>
<body>
<main id="app"><header class="hud">
<div class="metric"><small>SCORE</small><strong id="score">0</strong></div><div class="metric"><small>撃破</small><strong id="kills">0</strong></div>
<div class="metric hp"><small>HP <b id="hpText">60</b>/60</small><div class="track"><div id="hpBar" class="bar"></div></div></div>
<div class="metric"><small>連射</small><strong id="rate">Lv1</strong></div><div class="metric"><small>威力</small><strong id="power">Lv1</strong></div><div class="metric"><small>BOSS</small><strong id="bossLv">Lv1</strong></div><button id="restart">再開</button>
</header><section id="wrap"><canvas id="game" width="960" height="620"></canvas><div id="overlay" class="overlay hidden"></div></section>
<div class="help">操作: ← → キー、またはマウス移動 ｜ 射撃: 常時自動・弾数無限</div></main>
<script>
'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),W=960,H=620,GY=120,BY=560,MAXHP=60;
const ui={score:score,kills:kills,hp:hpText,bar:hpBar,rate:rate,power:power,boss:bossLv,over:overlay};
let g,last=performance.now(),spawnT=0,shotT=0,gateT=0,id=1,bossPending=false;const keys={ArrowLeft:false,ArrowRight:false};
function reset(){g={on:true,score:0,kills:0,hp:MAXHP,px:480,time:0,gate:false,bullets:[],enemies:[],items:[],walls:{left:15,right:30},rateLv:1,powerLv:1,bossLv:1,flash:0};spawnT=.25;shotT=0;gateT=0;bossPending=false;ui.over.classList.add('hidden');sync()}
function sync(){ui.score.textContent=g.score;ui.kills.textContent=g.kills;ui.hp.textContent=Math.max(0,g.hp);ui.bar.style.width=Math.max(0,g.hp)/MAXHP*100+'%';ui.bar.style.background=g.hp>30?'#38d06f':g.hp>15?'#f3b53f':'#ef4444';ui.rate.textContent='Lv'+g.rateLv;ui.power.textContent='Lv'+g.powerLv;ui.boss.textContent='Lv'+g.bossLv}
function pos(e){const r=c.getBoundingClientRect();return(e.clientX-r.left)*W/r.width}function follow(e){g.px=Math.max(225,Math.min(735,pos(e)))}
c.addEventListener('pointermove',follow);c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);follow(e)});addEventListener('keydown',e=>{if(e.code in keys){keys[e.code]=true;e.preventDefault()}if(e.code==='Enter'&&!g.on)reset()});addEventListener('keyup',e=>{if(e.code in keys)keys[e.code]=false});restart.onclick=reset;
function fire(){g.bullets.push({id:id++,x:g.px,y:BY-48})}
function spawn(type='normal'){const q=type==='boss'?{hp:100*Math.pow(1.65,g.bossLv-1),r:42+Math.min(18,(g.bossLv-1)*4),s:31+Math.min(18,(g.bossLv-1)*3),d:Math.min(60,35+(g.bossLv-1)*10),p:300*g.bossLv}:type==='heavy'?{hp:12,r:27,s:38,d:30,p:60}:{hp:3,r:18,s:50+Math.random()*9,d:20,p:10};g.enemies.push({id:id++,type,x:480+(Math.random()-.5)*105,y:GY+30,max:q.hp,hp:q.hp,...q});g.gate=true;gateT=.32}
function release(side){const n=side==='left'?3:2;for(let i=0;i<n;i++)g.items.push({id:id++,side,x:side==='left'?330:630,y:220-i*58,label:side==='left'?'連射UP':'威力UP'})}
function prepareBossStage(){const n=g.bossLv;g.walls.left=15+(n-1)*5;g.walls.right=30+(n-1)*8;g.items=[]}function warning(){if(bossPending)return;bossPending=true;g.on=false;prepareBossStage();ui.over.innerHTML='BOSS Lv'+g.bossLv+'<span>強化ボス出現・新しい壁とリワードを配置</span>';ui.over.classList.remove('hidden');setTimeout(()=>{ui.over.classList.add('hidden');bossPending=false;if(g.hp>0){g.on=true;spawn('boss');g.bossLv++}},1200)}
function killed(e){g.kills++;g.score+=e.p;if(g.kills%20===0)spawn('heavy');if(g.kills%30===0)warning()}
function wallHit(b){if(b.y>290)return false;if(b.x<405&&g.walls.left>0){if(--g.walls.left===0)release('left');return true}if(b.x>555&&g.walls.right>0){if(--g.walls.right===0)release('right');return true}return false}
function end(){g.on=false;ui.over.innerHTML='GAME OVER<span>Enter または「再開」でリトライ</span>';ui.over.classList.remove('hidden')}
function update(dt){if(!g.on)return;g.time+=dt;if(keys.ArrowLeft)g.px-=330*dt;if(keys.ArrowRight)g.px+=330*dt;g.px=Math.max(225,Math.min(735,g.px));shotT-=dt;if(shotT<=0){fire();shotT=Math.max(.055,.10-(g.rateLv-1)*.012)}spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.42,.78-g.time*.003);if(Math.random()<.38){spawn();spawn()}}gateT-=dt;if(gateT<=0)g.gate=false;if(g.flash>0)g.flash-=dt;g.bullets.forEach(b=>b.y-=610*dt);g.enemies.forEach(e=>e.y+=e.s*(1+g.time/500)*dt);g.items.forEach(i=>i.y+=80*dt);
const spent=new Set(),dead=new Set(),brokenItems=new Set();for(const b of g.bullets){let hit=false;for(const i of g.items){if(brokenItems.has(i.id))continue;if(Math.abs(b.x-i.x)<40&&Math.abs(b.y-i.y)<22){spent.add(b.id);brokenItems.add(i.id);if(i.side==='left')g.rateLv=Math.min(5,g.rateLv+1);else g.powerLv=Math.min(5,g.powerLv+1);hit=true;break}}if(hit)continue;if(wallHit(b)){spent.add(b.id);continue}for(const e of g.enemies){if(dead.has(e.id))continue;const z=.5+(e.y-GY)/(BY-GY)*.85;if(Math.abs(b.x-e.x)<e.r*z&&Math.abs(b.y-e.y)<e.r*z+8){spent.add(b.id);e.hp-=g.powerLv;if(e.hp<=0){dead.add(e.id);killed(e)}break}}}g.bullets=g.bullets.filter(b=>!spent.has(b.id)&&b.y>52);g.enemies=g.enemies.filter(e=>!dead.has(e.id));g.items=g.items.filter(i=>!brokenItems.has(i.id)&&i.y<H+30);g.enemies=g.enemies.filter(e=>{if(e.y>BY-5){g.hp-=e.d;g.flash=.18;if(g.hp<=0){g.hp=0;end()}return false}return true});sync()}
function poly(p,f,s){x.beginPath();p.forEach((v,i)=>i?x.lineTo(...v):x.moveTo(...v));x.closePath();x.fillStyle=f;x.fill();x.strokeStyle=s;x.lineWidth=3;x.stroke()}
function castle(){x.fillStyle='#625f5b';x.fillRect(347,24,266,112);for(let a=347;a<613;a+=53)x.fillRect(a,5,34,31);x.fillStyle='#514c47';x.fillRect(278,50,82,100);x.fillRect(600,50,82,100);x.fillStyle=g.gate?'#0f0d0b':'#4a2f20';x.beginPath();x.arc(480,121,48,Math.PI,0);x.fill();x.fillRect(432,120,96,47);if(!g.gate){x.strokeStyle='#17120f';x.lineWidth=5;for(let a=442;a<525;a+=14){x.beginPath();x.moveTo(a,78);x.lineTo(a,166);x.stroke()}}}
function knight(e){const z=.5+(e.y-GY)/(BY-GY)*.9,s=e.r*z,b=e.type==='boss';x.save();x.translate(e.x,e.y);x.fillStyle=b?'#171b22':e.type==='heavy'?'#6b2727':'#aab1b9';x.fillRect(-s*.55,-s*.1,s*1.1,s*1.2);x.fillStyle='#cbd0d5';x.beginPath();x.arc(0,-s*.38,s*.5,Math.PI,0);x.fill();x.fillStyle='#2b3037';x.fillRect(-s*.38,-s*.4,s*.76,s*.12);x.fillStyle=b?'#111':'#566576';poly([[-s*.92,0],[-s*.28,-s*.32],[-s*.28,s*.68],[-s*.92,s*.35]],b?'#111':'#566576','#20262d');x.strokeStyle='#e1ddd1';x.lineWidth=Math.max(2,s*.12);x.beginPath();x.moveTo(s*.42,-s*.25);x.lineTo(s*.92,s*.75);x.stroke();x.fillStyle='#211d1d';x.fillRect(-s*.43,s,s*.28,s*.55);x.fillRect(s*.15,s,s*.28,s*.55);x.fillStyle='#391013';x.fillRect(-s,-s*.94,s*2,5);x.fillStyle='#ef4444';x.fillRect(-s,-s*.94,s*2*(e.hp/e.max),5);x.restore()}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,225);sky.addColorStop(0,'#5fb9ee');sky.addColorStop(1,'#d2efff');x.fillStyle=sky;x.fillRect(0,0,W,225);x.fillStyle='#779449';x.fillRect(0,225,W,H-225);castle();poly([[300,152],[360,152],[445,620],[175,620]],'#9c7043','#6d4b2f');poly([[450,152],[510,152],[600,620],[360,620]],'#93643c','#67462d');poly([[600,152],[660,152],[785,620],[515,620]],'#9c7043','#6d4b2f');x.fillStyle='#fff';x.font='bold 13px system-ui';x.fillText('連射UP',302,180);x.fillText('敵',472,180);x.fillText('威力UP',606,180);[['left',330],['right',630]].forEach(([s,a])=>{if(g.walls[s]>0){x.fillStyle='#504a45';x.fillRect(a-54,255,108,34);x.strokeStyle='#272422';x.strokeRect(a-54,255,108,34);x.fillStyle='#fff';x.textAlign='center';x.fillText('壁 '+g.walls[s],a,277);x.textAlign='left'}});g.items.forEach(i=>{x.fillStyle=i.side==='left'?'#119b62':'#7c3aed';x.fillRect(i.x-38,i.y-17,76,34);x.strokeStyle='#fff';x.strokeRect(i.x-38,i.y-17,76,34);x.fillStyle='#fff';x.textAlign='center';x.fillText(i.label,i.x,i.y+5);x.font='10px system-ui';x.fillText('1発で発動',i.x,i.y+30);x.font='bold 13px system-ui';x.textAlign='left'});g.enemies.sort((a,b)=>a.y-b.y).forEach(knight);g.bullets.forEach(b=>{x.fillStyle='#fff7ae';x.shadowColor='#fff';x.shadowBlur=10;x.fillRect(b.x-3,b.y-13,6,22);x.shadowBlur=0});x.save();x.translate(g.px,BY);x.fillStyle='#263341';x.fillRect(-38,-5,76,41);x.fillRect(-10,-65,20,65);x.fillStyle='#101722';x.beginPath();x.arc(-31,37,17,0,Math.PI*2);x.arc(31,37,17,0,Math.PI*2);x.fill();x.restore();if(g.flash>0){x.fillStyle='rgba(255,20,20,.35)';x.fillRect(0,0,W,H)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
